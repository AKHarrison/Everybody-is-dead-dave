name: Playwright — HTML5 Smoke Test 🎭

# ⚠️  THIS WORKFLOW IS STUBBED — it will never run until `if: false` is removed.
#
# To activate this workflow you need to:
#   1. In the Godot editor: Project → Export → Add preset → Web (HTML5)
#   2. Configure the export path to `build/index.html`
#   3. Commit the resulting `Everybody is dead Dave/export_presets.cfg`
#   4. Remove the `if: false` condition from the `smoke-test` job below
#
# What this does when active:
#   - Installs Godot 4.5 headless binary
#   - Exports an HTML5 build
#   - Serves it on localhost:3000
#   - Playwright opens Chromium and checks the start screen loads
#   - Asserts the game title is visible and no JS console errors occur
#
# Why bother? Because "it works on my machine" isn't good enough when
# Gran is chasing you through Whitley Bay.

on:
  pull_request:
    branches:
      - master

jobs:
  smoke-test:
    name: 🎭 HTML5 Smoke Test
    runs-on: ubuntu-latest
    if: false  # ← Remove this line once export_presets.cfg is committed

    permissions:
      contents: read

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🎮 Install Godot 4.5 headless
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.5-stable/Godot_v4.5-stable_linux.x86_64.zip
          unzip -q Godot_v4.5-stable_linux.x86_64.zip
          chmod +x Godot_v4.5-stable_linux.x86_64
          sudo mv Godot_v4.5-stable_linux.x86_64 /usr/local/bin/godot

      - name: 🌐 Install Godot export templates
        run: |
          # Download web export templates
          wget -q https://github.com/godotengine/godot/releases/download/4.5-stable/Godot_v4.5-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.5.stable
          unzip -q Godot_v4.5-stable_export_templates.tpz -d /tmp/templates
          mv /tmp/templates/templates/* ~/.local/share/godot/export_templates/4.5.stable/

      - name: 🏗️ Export HTML5 build
        run: |
          mkdir -p build
          cd "Everybody is dead Dave"
          godot --headless --export-release "Web" ../build/index.html 2>&1
          ls -la ../build/

      - name: 🍽️ Serve the build
        run: |
          npm install -g serve
          serve build/ --listen 3000 &
          sleep 3

      - name: 🧪 Install Playwright
        run: |
          npm install -g @playwright/test
          npx playwright install chromium

      - name: 🎭 Run smoke test
        run: |
          cat > playwright.config.js << 'PWEOF'
          module.exports = {
            use: { baseURL: 'http://localhost:3000', headless: true }
          };
          PWEOF

          cat > smoke.spec.js << 'SPECEOF'
          const { test, expect } = require('@playwright/test');

          test('start screen loads without errors', async ({ page }) => {
            const consoleErrors = [];
            page.on('console', msg => {
              if (msg.type() === 'error') consoleErrors.push(msg.text());
            });

            await page.goto('/');
            // Wait for the Godot canvas to initialise
            await page.waitForSelector('canvas', { timeout: 15000 });

            // No JS console errors
            expect(consoleErrors).toHaveLength(0);
          });
          SPECEOF

          npx playwright test smoke.spec.js
